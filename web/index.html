<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollamp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231b1c22'/%3E%3Ccircle cx='5' cy='5' r='2.2' fill='%23ff3fa4'/%3E%3Ccircle cx='11' cy='11' r='2.2' fill='%2324e0ff'/%3E%3Cpath d='M5 7 C5 13 11 3 11 9' stroke='%23ffd23f' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ollamp.css">
<script src="/ollamp.js" defer></script>
</head>
<body>
<main class="rack" id="rack">
  <div class="rail"><span class="brand">OLLAMP</span><span class="rail-text">MODULAR&nbsp;LLM&nbsp;MONITOR</span></div>

  <div class="row" id="row-top">
    <!-- Clock module -->
    <section class="mod mod-clk" aria-label="Clock">
      <span class="screw tl"></span><span class="screw br"></span>
      <header class="mod-head"><h2>CLK</h2><small>BUSY TIMER</small></header>
      <div class="display"><canvas id="timer" title="How long the GPUs have been busy without a break"></canvas></div>
      <div class="leds">
        <span class="led-box"><span class="led green" id="led-run"></span>RUN</span>
        <span class="led-box"><span class="led yellow" id="led-idle"></span>IDLE</span>
        <span class="led-box"><span class="led orange" id="led-hold"></span>HOLD</span>
        <span class="led-box"><span class="led red" id="led-err"></span>ERR</span>
      </div>
      <div class="knobs">
        <div class="knob-box"><div class="knob" id="k-power"></div><span class="klabel">POWER</span><span class="kvalue" id="v-power">–</span></div>
        <div class="knob-box"><div class="knob" id="k-vram"></div><span class="klabel">VRAM</span><span class="kvalue" id="v-vram">–</span></div>
      </div>
      <div class="buttons">
        <button type="button" id="b-hold" title="Pause updates (space)"><span class="led orange" id="led-btn-hold"></span>HOLD</button>
        <button type="button" id="b-reset" title="Reset timer and history (r)"><span class="led red"></span>RESET</button>
        <button type="button" id="b-gpu" title="Select GPU (g)"><span class="led cyan on"></span><span id="gpu-sel">ALL</span></button>
        <button type="button" id="b-vis" title="Change scope mode (v)"><span class="led green on"></span>MODE</button>
      </div>
    </section>

    <!-- Scope module -->
    <section class="mod mod-scope" aria-label="Scope">
      <span class="screw tl"></span><span class="screw br"></span>
      <header class="mod-head"><h2>SCOPE</h2><small id="scope-mode">GPU LOAD</small></header>
      <div class="screen"><canvas id="vis" title="Click to change mode"></canvas></div>
      <div class="scope-legend" id="scope-legend"></div>
      <div class="scope-foot" id="summary">–</div>
    </section>
    <!-- GPU modules are added here -->
  </div>

  <div class="rail thin"></div>

  <div class="row" id="row-inst">
    <!-- Instance modules are added here -->
  </div>

  <div class="rail"><span class="rail-text" id="rail-status">WAITING FOR SIGNAL…</span></div>

  <svg class="cables" id="cables" aria-hidden="true"></svg>
</main>
<p class="footnote">Ollamp reads nvidia-smi and /api/ps once a second. It never changes anything in Ollama.</p>
</body>
</html>
